<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הזמנת חיתוך</title>
<style>
  * { box-sizing: border-box; }
  body {
    direction: rtl;
    background: #f3f1ec;
    color: #20242b;
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 0 16px 48px;
  }
  .mono { font-family: "Consolas", "Courier New", monospace; }

  .app { max-width: 860px; margin: 0 auto; }

  .app-bar { padding: 20px 0 6px; }
  .app-bar__title { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 700; }
  .app-bar__icon { font-size: 24px; }
  .app-bar__hint { font-size: 13px; color: #6b7280; margin: 4px 0 0; }

  /* ---------- Global paste zone ---------- */
  .global-paste {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #ffffff;
    border: 2px dashed #33526b;
    border-radius: 14px;
    padding: 16px 18px;
    margin: 16px 0 18px;
    cursor: pointer;
  }
  .global-paste.dragover { border-color: #d9622b; background: #eceef1; }
  .global-paste__icon { font-size: 26px; }
  .global-paste__text { font-size: 13.5px; color: #6b7280; line-height: 1.5; }
  .global-paste__text strong { color: #20242b; }

  /* ---------- Item cards ---------- */
  .items-list { display: flex; flex-direction: column; gap: 14px; }

  .item-card {
    position: relative;
    background: #ffffff;
    border: 1px solid #d9dce1;
    border-radius: 14px;
    padding: 18px 20px 20px;
    box-shadow: 0 1px 2px rgba(32,36,43,0.06), 0 4px 14px rgba(32,36,43,0.06);
  }
  .item-card__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .item-card__num { font-weight: 700; font-size: 14px; color: #33526b; letter-spacing: 0.02em; }

  .icon-btn {
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: #eceef1; color: #6b7280; font-size: 13px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn.danger:hover { background: #fde8e8; color: #b91c1c; }

  .field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  @media (max-width: 620px) { .field-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: #6b7280; }

  select, input[type="text"], input[type="number"], textarea {
    width: 100%; font-family: inherit; font-size: 14.5px; color: #20242b;
    background: #fff; border: 1px solid #d9dce1; border-radius: 9px; padding: 9px 11px;
  }
  select:focus, input:focus, textarea:focus {
    outline: none; border-color: #d9622b; box-shadow: 0 0 0 3px rgba(217,98,43,0.25);
  }

  .dims-group[hidden] { display: none; }
  .dims-group { background: #eceef1; border: 1px solid #d9dce1; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .dims-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .dims-row .field { flex: 1; min-width: 100px; }

  .ocr-toggle-row { display: flex; align-items: center; gap: 10px; }
  .ocr-badge {
    font-size: 12px; font-weight: 600; color: #1a7f5a; background: #e4f5ee;
    border: 1px solid #b7e2cf; border-radius: 999px; padding: 3px 10px;
  }
  .ocr-badge[hidden] { display: none; }

  .ocr-panel[hidden] { display: none; }
  .ocr-panel { margin-top: 12px; background: #eceef1; border: 1px dashed #33526b; border-radius: 10px; padding: 14px; }
  .ocr-panel__controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .file-input { flex: 1; min-width: 160px; font-size: 12.5px; color: #6b7280; }

  .paste-zone {
    text-align: center; border: 1.5px dashed #d9dce1; border-radius: 8px; padding: 10px;
    font-size: 12.5px; color: #6b7280; cursor: pointer; outline: none;
  }
  .paste-zone:focus, .paste-zone.dragover { border-color: #d9622b; background: #fff; }

  .img-preview-wrap[hidden] { display: none; }
  .img-preview-wrap { position: relative; width: fit-content; max-width: 100%; margin-top: 10px; }
  .img-preview-wrap img { display: block; max-width: 100%; max-height: 180px; border-radius: 8px; border: 1px solid #d9dce1; }
  .remove-img-btn {
    position: absolute; top: -8px; left: -8px; width: 24px; height: 24px; border: none;
    border-radius: 50%; background: #b91c1c; color: #fff; font-size: 13px; line-height: 1;
    cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  .ocr-status { font-size: 12.5px; color: #33526b; min-height: 16px; margin-top: 8px; }
  .ocr-warning[hidden] { display: none; }
  .ocr-warning {
    font-size: 12px; color: #96450c; background: #fdf1e2; border: 1px solid #f2d6ad;
    border-radius: 6px; padding: 7px 10px; margin-top: 8px;
  }
  .ocr-raw-wrap[hidden] { display: none; }
  .ocr-raw-wrap { margin-top: 10px; }
  .ocr-raw-wrap label { display: block; font-size: 12px; color: #33526b; margin-bottom: 4px; }
  .ocr-raw-wrap textarea { min-height: 80px; max-height: 55vh; overflow-y: auto; resize: vertical; }

  /* ---------- Buttons ---------- */
  .btn {
    appearance: none; border: 1px solid #d9dce1; background: #fff; color: #20242b;
    font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 9px;
    padding: 10px 16px; cursor: pointer;
  }
  .btn:hover { border-color: #33526b; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn--small { font-size: 12.5px; padding: 7px 12px; }
  .btn--ghost { background: transparent; }
  .btn--accent { background: #d9622b; color: #fff; border-color: #b84f22; }
  .btn--accent:hover { background: #b84f22; }
  .btn--success { background: #1a7f5a; color: #fff; border-color: #1a7f5a; }
  .btn--steel { background: #33526b; color: #fff; border-color: #33526b; }

  .office-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .office-status { margin-top: 10px; font-size: 13px; color: #6b7280; min-height: 18px; }

  /* ---------- Summary / print ---------- */
  #summaryView[hidden] { display: none; }
  #summaryView { background: #fff; border: 1px solid #d9dce1; border-radius: 14px; padding: 24px; margin: 16px 0; }
  .print-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
  .print-table th, .print-table td { border: 1px solid #333; padding: 8px 10px; text-align: right; }
  .print-table th { background: #eee; }
  .print-meta { font-size: 13px; color: #444; margin-bottom: 4px; }
  .summary-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

  @media print {
    .no-print { display: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div id="editView">
    <header class="app-bar">
      <div class="app-bar__title"><span class="app-bar__icon">🔩</span><span>הזמנת חיתוך</span></div>
      <p class="app-bar__hint">מלא עד 10 פריטים (עם זיהוי אוטומטי מתמונה), ואז הצג סיכום לפני ההדפסה. שום דבר לא נשמר בענן - הכול נשאר במחשב הזה.</p>
    </header>

    <div class="global-paste" id="globalPaste" tabindex="0">
      <div class="global-paste__icon">📋</div>
      <div class="global-paste__text">
        <strong>הדבק תמונה (Ctrl+V)</strong> בכל מקום בעמוד - היא תיכנס אוטומטית לפריט הפנוי הבא ותנסה למלא אותו לפי הצילום
      </div>
    </div>

    <div class="items-list" id="itemsList"></div>

    <div class="office-actions">
      <button type="button" class="btn btn--ghost" id="addRowBtn">➕ הוסף פריט</button>
      <button type="button" class="btn btn--accent" id="showSummaryBtn">👁️ הצג סיכום להדפסה</button>
      <button type="button" class="btn btn--ghost" id="resetBtn">🗑️ התחלה מחדש</button>
    </div>
    <div class="office-status" id="officeStatus" role="status"></div>
  </div>

  <div id="summaryView" hidden>
    <h1>סיכום פריטים לחיתוך</h1>
    <div class="print-meta" id="printDate"></div>
    <table class="print-table">
      <thead><tr><th>#</th><th>צורה</th><th>חומר</th><th>מידות</th><th>מס' יחידות</th></tr></thead>
      <tbody id="printTableBody"></tbody>
    </table>
    <div class="summary-actions no-print">
      <button type="button" class="btn btn--accent" id="doPrintBtn">🖨️ הדפס</button>
      <button type="button" class="btn btn--ghost" id="copyBtn">📋 העתק כטקסט</button>
      <button type="button" class="btn btn--ghost" id="backToEditBtn">✏️ חזרה לעריכה</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script>
  // ============================================================
  // OCR: pure helpers (image preprocessing / recognition / parsing)
  // ============================================================
  function loadImageElement(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  async function buildPreprocessedCanvas(file, scale) {
    const img = await loadImageElement(file);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  // Cropping tightly around a single WORD (not a whole table line/row) matters:
  // a table row's bbox also contains the Hebrew label text, and re-recognizing
  // that whole strip with a digit-only whitelist can make the engine "invent"
  // extra digits from label glyphs or swallow the tiny decimal point entirely
  // (e.g. "12.7" coming back as "127"). A word-level bbox avoids that noise.
  async function recognizeNumberInRegion(canvas, bbox) {
    const pad = 8;
    const x = Math.max(0, Math.floor(bbox.x0 - pad));
    const y = Math.max(0, Math.floor(bbox.y0 - pad));
    const w = Math.min(canvas.width - x, Math.ceil((bbox.x1 - bbox.x0) + pad * 2));
    const h = Math.min(canvas.height - y, Math.ceil((bbox.y1 - bbox.y0) + pad * 2));
    if (w <= 0 || h <= 0) return null;

    const upscale = 4;
    const crop = document.createElement('canvas');
    crop.width = w * upscale;
    crop.height = h * upscale;
    const cctx = crop.getContext('2d');
    cctx.imageSmoothingEnabled = true;
    cctx.imageSmoothingQuality = 'high';
    cctx.drawImage(canvas, x, y, w, h, 0, 0, crop.width, crop.height);

    try {
      const { data } = await Tesseract.recognize(crop, 'eng', {
        tessedit_char_whitelist: '0123456789.,'
      });
      const cleaned = data.text.replace(/\s+/g, '');
      const match = cleaned.match(/\d+[.,]?\d*/);
      return match ? match[0].replace(',', '.') : null;
    } catch (e) {
      console.warn('region OCR failed', e);
      return null;
    }
  }

  // Tesseract.js (v5) returns a nested tree - data.blocks[].paragraphs[].lines[].words[] -
  // there is no flat data.lines/data.words array. Walk it down to a flat line list.
  function flattenOcrLines(ocrData) {
    if (Array.isArray(ocrData.lines)) return ocrData.lines;
    const lines = [];
    for (const block of ocrData.blocks || []) {
      for (const para of block.paragraphs || []) {
        for (const line of para.lines || []) {
          lines.push(line);
        }
      }
    }
    return lines;
  }

  // Finds the Hebrew label's own text line, then returns the bbox of the
  // numeric word on that same line (never the whole line/row bbox) so the
  // focused re-scan above only ever sees the digits themselves.
  function findLabelNumberBbox(ocrData, labelRegex) {
    if (!ocrData) return null;
    const lines = flattenOcrLines(ocrData);
    for (const line of lines) {
      if (!labelRegex.test(line.text)) continue;
      const words = (line.words || []).filter((w) => /\d/.test(w.text));
      let best = null;
      for (const w of words) {
        const cleaned = w.text.replace(/[^\d.,]/g, '');
        if (cleaned && (!best || cleaned.length > best.cleaned.length)) {
          best = { bbox: w.bbox, cleaned };
        }
      }
      if (best) return best.bbox;
    }
    return null;
  }

  // Positional fallback for the "קוטר פנימי / קוטר חיצוני / אורך" table used
  // by this raw-material system: when the Hebrew labels themselves are too
  // OCR-garbled to match by regex (e.g. "אורך" misread as "אירר"), fall back
  // to the fixed row order - each row ends in an "mm" unit, and the table
  // always lists inner diameter, then outer diameter, then length, in that
  // order - and read the last two "mm" rows as [outer diameter, length].
  function findMmRowBboxes(ocrData) {
    if (!ocrData) return [];
    const lines = flattenOcrLines(ocrData);
    const rows = [];
    for (const line of lines) {
      if (!/mm/i.test(line.text)) continue;
      const words = (line.words || []).filter((w) => /\d/.test(w.text));
      let best = null;
      for (const w of words) {
        const cleaned = w.text.replace(/[^\d.,]/g, '');
        if (cleaned && (!best || cleaned.length > best.cleaned.length)) {
          best = { bbox: w.bbox, cleaned };
        }
      }
      if (best) rows.push(best.bbox);
    }
    return rows;
  }

  function findNumberNear(text, label) {
    const lines = text.split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].includes(label)) {
        const candidates = [lines[i], lines[i + 1] || ''];
        for (const line of candidates) {
          const m = line.match(/(\d+(?:[.,]\d+)?)/);
          if (m) return m[1].replace(',', '.');
        }
      }
    }
    return null;
  }

  // Raw-material systems typically state the shape as a code in an
  // "אפיון" / "מפרט טכני" field (e.g. "BAR-RND\מוט עגול" for round bar).
  // Prefer reading that field when present; otherwise fall back to
  // scanning the whole recognized text for the same keywords/codes.
  function detectShapeFromText(text) {
    const lines = text.split('\n');
    const labeledLines = lines.filter((l) => /אפיון|מפרט\s*טכני/.test(l));
    // Try the labeled field first (most reliable when OCR keeps it intact),
    // but always fall back to the whole text - OCR often splits a table row
    // so the shape keyword ends up on a line that doesn't itself match
    // "אפיון"/"מפרט טכני", and searching only the labeled line would then
    // miss it even though it's clearly present elsewhere in the text.
    const candidates = labeledLines.length ? [labeledLines.join('\n'), text] : [text];
    for (const candidate of candidates) {
      if (/BAR[-\s]?RND|BAR[-\s]?ROUND|עגול|מוט/.test(candidate)) return 'מוט';
      if (/\bPLATE\b|\bSHEET\b|BAR[-\s]?SQ|פלטה|לוח|ריבוע|מלבן/.test(candidate)) return 'פלטה';
    }
    return null;
  }

  function translateStatus(status) {
    const map = {
      'loading tesseract core': 'טוען מנוע זיהוי',
      'initializing tesseract': 'מאתחל',
      'loading language traineddata': 'טוען שפה',
      'initializing api': 'מאתחל ממשק',
      'recognizing text': 'מזהה טקסט'
    };
    return map[status] || status;
  }

  function autoGrowTextarea(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // ============================================================
  // Item rows
  // ============================================================
  const MAX_ROWS = 10;
  const rows = [];
  const itemsList = document.getElementById('itemsList');
  const addRowBtn = document.getElementById('addRowBtn');
  const showSummaryBtn = document.getElementById('showSummaryBtn');
  const doPrintBtn = document.getElementById('doPrintBtn');
  const copyBtn = document.getElementById('copyBtn');
  const backToEditBtn = document.getElementById('backToEditBtn');
  const resetBtn = document.getElementById('resetBtn');
  const officeStatus = document.getElementById('officeStatus');
  const editView = document.getElementById('editView');
  const summaryView = document.getElementById('summaryView');

  function rowTemplate() {
    return `
      <div class="item-card">
        <div class="item-card__head">
          <span class="item-card__num" data-role="num">פריט</span>
          <button type="button" class="icon-btn danger" data-action="remove" title="הסר פריט" aria-label="הסר פריט">✕</button>
        </div>

        <div class="field-grid">
          <label class="field"><span>צורה</span>
            <select data-field="shape">
              <option value="">בחר צורה</option>
              <option value="מוט">מוט</option>
              <option value="פלטה">פלטה</option>
            </select>
          </label>
          <label class="field"><span>חומר</span>
            <input type="text" data-field="material" placeholder="לדוגמה: AISI 303">
          </label>
          <label class="field"><span>מס' יחידות</span>
            <input type="number" min="1" data-field="units">
          </label>
        </div>

        <div class="dims-group" data-dims="פלטה" hidden>
          <div class="dims-row">
            <label class="field"><span>H (גובה)</span><input type="number" step="any" data-field="h"></label>
            <label class="field"><span>W (רוחב)</span><input type="number" step="any" data-field="w"></label>
            <label class="field"><span>L (אורך)</span><input type="number" step="any" data-field="l_plate"></label>
          </div>
        </div>
        <div class="dims-group" data-dims="מוט" hidden>
          <div class="dims-row">
            <label class="field"><span>קוטר</span><input type="number" step="any" data-field="d"></label>
            <label class="field"><span>L (אורך)</span><input type="number" step="any" data-field="l_rod"></label>
          </div>
        </div>

        <div class="ocr-toggle-row">
          <button type="button" class="btn btn--small" data-action="toggle-ocr">📷 זיהוי מתמונה (OCR)</button>
          <span class="ocr-badge" data-role="badge" hidden>תמונה מצורפת</span>
        </div>

        <div class="ocr-panel" data-role="panel" hidden>
          <div class="ocr-panel__controls">
            <input type="file" accept="image/*" class="file-input" data-role="fileInput">
            <button type="button" class="btn btn--small btn--steel" data-action="runOcr" disabled>🔍 זהה טקסט מהתמונה</button>
          </div>
          <div class="paste-zone" data-role="pasteZone" tabindex="0">אפשר גם להדביק תמונה כאן (Ctrl+V)</div>
          <div class="img-preview-wrap" data-role="imgPreviewWrap" hidden>
            <img data-role="imgPreview" alt="תצוגה מקדימה">
            <button type="button" class="remove-img-btn" data-action="removeImg" aria-label="הסר תמונה">✕</button>
          </div>
          <div class="ocr-status" data-role="status"></div>
          <div class="ocr-warning" data-role="warning" hidden>⚠️ יש לבדוק את השדות המספריים (קוטר / אורך) - זיהוי אוטומטי אינו מובטח ב-100%.</div>
          <div class="ocr-raw-wrap" data-role="rawWrap" hidden>
            <label>טקסט שזוהה (ניתן לתקן ידנית לפני מילוי):</label>
            <textarea data-role="raw"></textarea>
            <button type="button" class="btn btn--small btn--success" data-action="applyOcr">✅ מלא את הפריט לפי הטקסט</button>
          </div>
        </div>
      </div>
    `;
  }

  function addRow() {
    if (rows.length >= MAX_ROWS) return null;
    const wrap = document.createElement('div');
    wrap.innerHTML = rowTemplate().trim();
    const el = wrap.firstElementChild;
    itemsList.appendChild(el);

    const row = {
      el,
      fields: {
        shape: el.querySelector('[data-field="shape"]'),
        material: el.querySelector('[data-field="material"]'),
        units: el.querySelector('[data-field="units"]'),
        h: el.querySelector('[data-field="h"]'),
        w: el.querySelector('[data-field="w"]'),
        l_plate: el.querySelector('[data-field="l_plate"]'),
        d: el.querySelector('[data-field="d"]'),
        l_rod: el.querySelector('[data-field="l_rod"]')
      },
      dimsPlate: el.querySelector('[data-dims="פלטה"]'),
      dimsRod: el.querySelector('[data-dims="מוט"]'),
      numEl: el.querySelector('[data-role="num"]'),
      ocr: {
        file: null,
        lastData: null,
        lastCanvas: null,
        panel: el.querySelector('[data-role="panel"]'),
        badge: el.querySelector('[data-role="badge"]'),
        fileInput: el.querySelector('[data-role="fileInput"]'),
        runBtn: el.querySelector('[data-action="runOcr"]'),
        pasteZone: el.querySelector('[data-role="pasteZone"]'),
        imgPreviewWrap: el.querySelector('[data-role="imgPreviewWrap"]'),
        imgPreview: el.querySelector('[data-role="imgPreview"]'),
        status: el.querySelector('[data-role="status"]'),
        warning: el.querySelector('[data-role="warning"]'),
        rawWrap: el.querySelector('[data-role="rawWrap"]'),
        raw: el.querySelector('[data-role="raw"]')
      }
    };
    rows.push(row);

    row.fields.shape.addEventListener('change', () => {
      const v = row.fields.shape.value;
      row.dimsPlate.hidden = v !== 'פלטה';
      row.dimsRod.hidden = v !== 'מוט';
    });

    el.querySelector('[data-action="remove"]').addEventListener('click', () => removeRow(row));
    el.querySelector('[data-action="toggle-ocr"]').addEventListener('click', () => {
      row.ocr.panel.hidden = !row.ocr.panel.hidden;
    });
    el.querySelector('[data-action="removeImg"]').addEventListener('click', () => clearRowImage(row));
    el.querySelector('[data-action="runOcr"]').addEventListener('click', () => runOcrForRow(row));
    el.querySelector('[data-action="applyOcr"]').addEventListener('click', () => {
      applyOcrToRow(row, row.ocr.raw.value, row.ocr.lastData, row.ocr.lastCanvas);
    });
    row.ocr.raw.addEventListener('input', () => autoGrowTextarea(row.ocr.raw));
    row.ocr.fileInput.addEventListener('change', function () {
      const file = this.files && this.files[0] ? this.files[0] : null;
      if (file) loadImageIntoRow(row, file);
    });
    row.ocr.pasteZone.addEventListener('focus', () => row.ocr.pasteZone.classList.add('dragover'));
    row.ocr.pasteZone.addEventListener('blur', () => row.ocr.pasteZone.classList.remove('dragover'));
    row.ocr.pasteZone.addEventListener('dragover', (e) => { e.preventDefault(); row.ocr.pasteZone.classList.add('dragover'); });
    row.ocr.pasteZone.addEventListener('dragleave', () => row.ocr.pasteZone.classList.remove('dragover'));
    row.ocr.pasteZone.addEventListener('drop', (e) => {
      e.preventDefault();
      row.ocr.pasteZone.classList.remove('dragover');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file && file.type.indexOf('image') !== -1) loadImageIntoRow(row, file);
    });

    renumberRows();
    addRowBtn.disabled = rows.length >= MAX_ROWS;
    return row;
  }

  function removeRow(row) {
    row.el.remove();
    const idx = rows.indexOf(row);
    if (idx !== -1) rows.splice(idx, 1);
    if (rows.length === 0) addRow();
    renumberRows();
    addRowBtn.disabled = rows.length >= MAX_ROWS;
  }

  function renumberRows() {
    rows.forEach((r, i) => { r.numEl.textContent = `פריט ${i + 1}`; });
  }

  function resetAllRows() {
    itemsList.innerHTML = '';
    rows.length = 0;
    addRow();
  }

  function loadImageIntoRow(row, file) {
    row.ocr.file = file;
    row.ocr.imgPreview.src = URL.createObjectURL(file);
    row.ocr.imgPreviewWrap.hidden = false;
    row.ocr.runBtn.disabled = false;
    row.ocr.status.textContent = 'תמונה נטענה. לוחצים על "זהה טקסט מהתמונה".';
    row.ocr.warning.hidden = true;
    row.ocr.rawWrap.hidden = true;
    row.ocr.badge.hidden = false;
    row.ocr.panel.hidden = false;
  }

  function clearRowImage(row) {
    row.ocr.file = null;
    row.ocr.lastData = null;
    row.ocr.lastCanvas = null;
    row.ocr.imgPreviewWrap.hidden = true;
    row.ocr.imgPreview.src = '';
    row.ocr.runBtn.disabled = true;
    row.ocr.status.textContent = '';
    row.ocr.warning.hidden = true;
    row.ocr.rawWrap.hidden = true;
    row.ocr.raw.value = '';
    row.ocr.raw.style.height = '';
    row.ocr.fileInput.value = '';
    row.ocr.badge.hidden = true;
  }

  async function runOcrForRow(row) {
    if (!row.ocr.file) return;
    row.ocr.runBtn.disabled = true;
    row.ocr.warning.hidden = true;
    row.ocr.status.textContent = 'מעבד את התמונה...';

    try {
      const canvas = await buildPreprocessedCanvas(row.ocr.file, 2.5);
      row.ocr.status.textContent = 'מזהה טקסט מהתמונה...';

      const { data } = await Tesseract.recognize(canvas, 'heb+eng', {
        logger: (m) => {
          if (m.status && typeof m.progress === 'number') {
            row.ocr.status.textContent = `${translateStatus(m.status)} ${(m.progress * 100).toFixed(0)}%`;
          }
        }
      });

      row.ocr.raw.value = data.text.trim();
      row.ocr.rawWrap.hidden = false;
      autoGrowTextarea(row.ocr.raw);
      row.ocr.lastData = data;
      row.ocr.lastCanvas = canvas;

      row.ocr.status.textContent = 'מדייק ערכים מספריים...';
      await applyOcrToRow(row, data.text, data, canvas);

      row.ocr.status.textContent = 'זיהוי הושלם. בדוק את השדות ותקן במידת הצורך.';
      row.ocr.warning.hidden = false;
    } catch (err) {
      console.error(err);
      row.ocr.status.textContent = 'אירעה שגיאה בזיהוי הטקסט. נסה תמונה ברורה יותר.';
    } finally {
      row.ocr.runBtn.disabled = false;
    }
  }

  async function applyOcrToRow(row, rawText, ocrData, canvas) {
    const text = rawText.replace(/\r/g, '');

    const materialMatch = text.match(/AISI\s*[- ]?\s*\d+/i);
    if (materialMatch) {
      row.fields.material.value = materialMatch[0].toUpperCase().replace(/\s+/g, ' ');
    }

    let outerDiameter = null;
    let length = null;
    let hVal = null;
    let wVal = null;

    if (ocrData && canvas) {
      const outerBbox = findLabelNumberBbox(ocrData, /קוטר\s*חיצוני/);
      const innerBbox = findLabelNumberBbox(ocrData, /קוטר\s*פנימי/);
      const lengthBbox = findLabelNumberBbox(ocrData, /אורך|ארוך/);
      const hBbox = findLabelNumberBbox(ocrData, /גובה/);
      const wBbox = findLabelNumberBbox(ocrData, /רוחב/);

      if (outerBbox) outerDiameter = await recognizeNumberInRegion(canvas, outerBbox);
      if (lengthBbox) length = await recognizeNumberInRegion(canvas, lengthBbox);
      if (hBbox) hVal = await recognizeNumberInRegion(canvas, hBbox);
      if (wBbox) wVal = await recognizeNumberInRegion(canvas, wBbox);

      if (!outerDiameter && !innerBbox) {
        const genericBbox = findLabelNumberBbox(ocrData, /קוטר/);
        if (genericBbox) outerDiameter = await recognizeNumberInRegion(canvas, genericBbox);
      }

      // Last resort for a rod-style table: the labels themselves may be too
      // OCR-garbled to match by regex at all (not just missing a space -
      // "אורך" misread as "אירר" for example). Only try this when there's
      // no sign we're looking at a plate's H/W table instead.
      if ((!outerDiameter || !length) && !hBbox && !wBbox) {
        const mmRows = findMmRowBboxes(ocrData);
        if (mmRows.length >= 1 && !length) {
          length = await recognizeNumberInRegion(canvas, mmRows[mmRows.length - 1]);
        }
        if (mmRows.length >= 2 && !outerDiameter) {
          outerDiameter = await recognizeNumberInRegion(canvas, mmRows[mmRows.length - 2]);
        }
      }
    }

    if (!outerDiameter) outerDiameter = findNumberNear(text, 'קוטר חיצוני') || findNumberNear(text, 'קוטר');
    if (!length) length = findNumberNear(text, 'אורך') || findNumberNear(text, 'ארוך');
    if (!hVal) hVal = findNumberNear(text, ' H ') || findNumberNear(text, 'גובה');
    if (!wVal) wVal = findNumberNear(text, ' W ') || findNumberNear(text, 'רוחב');

    // Decide the shape - prefer the text/code detection, but if that comes up
    // empty, fall back to WHICH dimension we actually recognized: a diameter
    // means a round bar, a height/width means a plate. Without this, a
    // recognized diameter/length can sit correctly in the (hidden) rod
    // fields while the shape select stays unset, so the dims section never
    // becomes visible and the values look like they "didn't fill".
    let shape = detectShapeFromText(text);
    if (!shape) {
      if (outerDiameter) shape = 'מוט';
      else if (hVal || wVal) shape = 'פלטה';
    }
    if (shape) {
      row.fields.shape.value = shape;
      row.fields.shape.dispatchEvent(new Event('change'));
    }

    if (outerDiameter) row.fields.d.value = outerDiameter;
    if (length) {
      row.fields.l_rod.value = length;
      row.fields.l_plate.value = length;
    }
    if (hVal) row.fields.h.value = hVal;
    if (wVal) row.fields.w.value = wVal;

    const unitsMatch = text.match(/(?:מס['׳]?\s*יחיד|כמות)[^\d]{0,10}(\d+)/);
    if (unitsMatch) row.fields.units.value = unitsMatch[1];
  }

  // ============================================================
  // Global paste - routes each pasted/uploaded image to the next row
  // that doesn't have one yet, auto-adding a fresh row if all existing
  // ones already have an image (up to MAX_ROWS), then runs OCR on it.
  // ============================================================
  function routeIncomingImage(file) {
    let target = rows.find((r) => !r.ocr.file);
    if (!target) {
      if (rows.length >= MAX_ROWS) {
        alert(`הגעת למספר המרבי של פריטים (${MAX_ROWS}).`);
        return;
      }
      target = addRow();
    }
    loadImageIntoRow(target, file);
    target.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    runOcrForRow(target);
  }

  function extractImageFromClipboard(clipboardData) {
    if (!clipboardData || !clipboardData.items) return null;
    for (const item of clipboardData.items) {
      if (item.type && item.type.indexOf('image') !== -1) return item.getAsFile();
    }
    return null;
  }

  document.addEventListener('paste', function (e) {
    const file = extractImageFromClipboard(e.clipboardData || window.clipboardData);
    if (!file) return;
    e.preventDefault();

    const active = document.activeElement;
    const rowForActiveZone = rows.find((r) => r.ocr.pasteZone === active);
    if (rowForActiveZone) {
      loadImageIntoRow(rowForActiveZone, file);
      runOcrForRow(rowForActiveZone);
    } else {
      routeIncomingImage(file);
    }
  });

  const globalPaste = document.getElementById('globalPaste');
  globalPaste.addEventListener('dragover', (e) => { e.preventDefault(); globalPaste.classList.add('dragover'); });
  globalPaste.addEventListener('dragleave', () => globalPaste.classList.remove('dragover'));
  globalPaste.addEventListener('drop', (e) => {
    e.preventDefault();
    globalPaste.classList.remove('dragover');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file && file.type.indexOf('image') !== -1) routeIncomingImage(file);
  });

  addRowBtn.addEventListener('click', () => addRow());

  // ============================================================
  // Collect valid rows
  // ============================================================
  function collectRowData(row) {
    const shape = row.fields.shape.value;
    const material = row.fields.material.value.trim();
    const units = row.fields.units.value;
    if (!shape || !material || !units) return null;

    let dimsText = '';
    if (shape === 'פלטה') {
      const h = row.fields.h.value;
      const w = row.fields.w.value;
      const l = row.fields.l_plate.value;
      dimsText = `H: ${h || '-'} | W: ${w || '-'} | L: ${l || '-'} מ"מ`;
    } else if (shape === 'מוט') {
      const d = row.fields.d.value;
      const l = row.fields.l_rod.value;
      dimsText = `קוטר: ${d || '-'} | אורך: ${l || '-'} מ"מ`;
    }
    return { shape, material, units, dimsText };
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function getValidatedItems() {
    const collected = rows.map(collectRowData).filter(Boolean);
    if (collected.length === 0) {
      alert('לא הוזן אף פריט תקין (חובה למלא לפחות צורה, חומר ומס\' יחידות).');
      return null;
    }
    return collected;
  }

  // ============================================================
  // Summary / print
  // ============================================================
  const printDate = document.getElementById('printDate');
  const printTableBody = document.getElementById('printTableBody');
  let lastSummaryItems = [];

  showSummaryBtn.addEventListener('click', () => {
    const items = getValidatedItems();
    if (!items) return;
    lastSummaryItems = items;

    printDate.textContent = 'תאריך: ' + new Date().toLocaleString('he-IL');
    printTableBody.innerHTML = items.map((item, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${escapeHtml(item.shape)}</td>
        <td>${escapeHtml(item.material)}</td>
        <td>${escapeHtml(item.dimsText)}</td>
        <td>${escapeHtml(item.units)}</td>
      </tr>
    `).join('');

    editView.hidden = true;
    summaryView.hidden = false;
  });

  doPrintBtn.addEventListener('click', () => {
    window.print();
  });

  backToEditBtn.addEventListener('click', () => {
    summaryView.hidden = true;
    editView.hidden = false;
  });

  copyBtn.addEventListener('click', async () => {
    const items = lastSummaryItems;
    if (!items.length) return;

    const lines = ['רשימת פריטים לחיתוך', ''];
    items.forEach((item, i) => {
      lines.push(`פריט ${i + 1}:`);
      lines.push(`  צורה: ${item.shape}`);
      lines.push(`  חומר: ${item.material}`);
      lines.push(`  מידות: ${item.dimsText}`);
      lines.push(`  מס' יחידות: ${item.units}`);
      lines.push('');
    });
    const text = lines.join('\n');

    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = '✅ הועתק!';
      setTimeout(() => { copyBtn.textContent = '📋 העתק כטקסט'; }, 1800);
    } catch (e) {
      alert('לא ניתן להעתיק אוטומטית. יש להעתיק ידנית:\n\n' + text);
    }
  });

  resetBtn.addEventListener('click', () => {
    if (!confirm('לאפס את כל הפריטים ולהתחיל מחדש?')) return;
    resetAllRows();
    officeStatus.textContent = '';
  });

  // init
  addRow();
</script>

</body>
</html>

<title>הזמנת חיתוך</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #f3f1ec;
    --surface: #ffffff;
    --surface-2: #eceef1;
    --border: #d9dce1;
    --text: #20242b;
    --text-muted: #6b7280;
    --accent: #d9622b;
    --accent-strong: #b84f22;
    --accent-contrast: #ffffff;
    --steel: #33526b;
    --steel-contrast: #ffffff;
    --success: #1a7f5a;
    --success-bg: #e4f5ee;
    --success-border: #b7e2cf;
    --warning-bg: #fdf1e2;
    --warning-text: #96450c;
    --warning-border: #f2d6ad;
    --danger: #b91c1c;
    --danger-bg: #fde8e8;
    --focus-ring: rgba(217, 98, 43, 0.35);
    --shadow: 0 1px 2px rgba(32, 36, 43, 0.06), 0 4px 14px rgba(32, 36, 43, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181d;
      --surface: #1b2027;
      --surface-2: #232a33;
      --border: #333c47;
      --text: #e8eaed;
      --text-muted: #9aa3af;
      --accent: #f2793c;
      --accent-strong: #ffa066;
      --accent-contrast: #1b1006;
      --steel: #7fa2bd;
      --steel-contrast: #0d1720;
      --success: #3ecf95;
      --success-bg: #10291f;
      --success-border: #1f4636;
      --warning-bg: #3a2712;
      --warning-text: #f0b169;
      --warning-border: #5a3d1d;
      --danger: #f56565;
      --danger-bg: #3a1414;
      --focus-ring: rgba(242, 121, 60, 0.4);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181d;
    --surface: #1b2027;
    --surface-2: #232a33;
    --border: #333c47;
    --text: #e8eaed;
    --text-muted: #9aa3af;
    --accent: #f2793c;
    --accent-strong: #ffa066;
    --accent-contrast: #1b1006;
    --steel: #7fa2bd;
    --steel-contrast: #0d1720;
    --success: #3ecf95;
    --success-bg: #10291f;
    --success-border: #1f4636;
    --warning-bg: #3a2712;
    --warning-text: #f0b169;
    --warning-border: #5a3d1d;
    --danger: #f56565;
    --danger-bg: #3a1414;
    --focus-ring: rgba(242, 121, 60, 0.4);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    direction: rtl;
    background: var(--bg);
    color: var(--text);
    font-family: "Rubik", system-ui, sans-serif;
    margin: 0;
    padding: 0 16px 48px;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .app { max-width: 860px; margin: 0 auto; }

  .app-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 20px 0 16px;
  }
  .app-bar__title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: 700;
  }
  .app-bar__icon { font-size: 24px; }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
  }
  .tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .tab.active { background: var(--accent); color: var(--accent-contrast); }
  .tab:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .view[hidden] { display: none; }

  /* ---------- Global paste zone ---------- */
  .global-paste {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 2px dashed var(--steel);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 18px;
    cursor: pointer;
  }
  .global-paste:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .global-paste.dragover { border-color: var(--accent); background: var(--surface-2); }
  .global-paste__icon { font-size: 26px; }
  .global-paste__text { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }
  .global-paste__text strong { color: var(--text); }

  /* ---------- Item cards ---------- */
  .items-list { display: flex; flex-direction: column; gap: 14px; }

  .item-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px 20px;
    box-shadow: var(--shadow);
  }
  .item-card__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .item-card__num {
    font-weight: 700;
    font-size: 14px;
    color: var(--steel);
    letter-spacing: 0.02em;
  }

  .icon-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn.danger:hover { background: var(--danger-bg); color: var(--danger); }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 620px) {
    .field-grid { grid-template-columns: 1fr; }
  }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .field > span { padding-inline-start: 1px; }

  select, input[type="text"], input[type="number"], textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 11px;
  }
  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }

  .dims-group[hidden] { display: none; }
  .dims-group {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .dims-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .dims-row .field { flex: 1; min-width: 100px; }

  .ocr-toggle-row { display: flex; align-items: center; gap: 10px; }
  .ocr-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--success);
    background: var(--success-bg);
    border: 1px solid var(--success-border);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .ocr-badge[hidden] { display: none; }

  .ocr-panel[hidden] { display: none; }
  .ocr-panel {
    margin-top: 12px;
    background: var(--surface-2);
    border: 1px dashed var(--steel);
    border-radius: 10px;
    padding: 14px;
  }
  .ocr-panel__controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .file-input { flex: 1; min-width: 160px; font-size: 12.5px; color: var(--text-muted); }

  .paste-zone {
    text-align: center;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 12.5px;
    color: var(--text-muted);
    cursor: pointer;
    outline: none;
  }
  .paste-zone:focus, .paste-zone.dragover { border-color: var(--accent); background: var(--surface); }

  .img-preview-wrap[hidden] { display: none; }
  .img-preview-wrap { position: relative; width: fit-content; max-width: 100%; margin-top: 10px; }
  .img-preview-wrap img { display: block; max-width: 100%; max-height: 180px; border-radius: 8px; border: 1px solid var(--border); }
  .remove-img-btn {
    position: absolute;
    top: -8px;
    left: -8px;
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  .ocr-status { font-size: 12.5px; color: var(--steel); min-height: 16px; margin-top: 8px; }
  .ocr-warning[hidden] { display: none; }
  .ocr-warning {
    font-size: 12px;
    color: var(--warning-text);
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    border-radius: 6px;
    padding: 7px 10px;
    margin-top: 8px;
  }
  .ocr-raw-wrap[hidden] { display: none; }
  .ocr-raw-wrap { margin-top: 10px; }
  .ocr-raw-wrap label { display: block; font-size: 12px; color: var(--steel); margin-bottom: 4px; }
  .ocr-raw-wrap textarea {
    min-height: 80px;
    max-height: 55vh;
    overflow-y: auto;
    resize: vertical;
  }

  /* ---------- Buttons ---------- */
  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 9px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--steel); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn--small { font-size: 12.5px; padding: 7px 12px; }
  .btn--ghost { background: transparent; }
  .btn--accent { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent-strong); }
  .btn--accent:hover { background: var(--accent-strong); }
  .btn--success { background: var(--success); color: #fff; border-color: var(--success); }
  .btn--steel { background: var(--steel); color: var(--steel-contrast); border-color: var(--steel); }

  .office-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .office-status { margin-top: 10px; font-size: 13px; color: var(--text-muted); min-height: 18px; }

  /* ---------- Worker view ---------- */
  .worker-section { margin-bottom: 28px; }
  .worker-section__title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    margin: 0 0 12px;
  }
  .count-pill {
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 12.5px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 10px;
  }

  .ticket-list { display: flex; flex-direction: column; gap: 10px; }
  .ticket {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-inline-start: 5px solid var(--accent);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .ticket--done { border-inline-start-color: var(--success); opacity: 0.85; }
  .ticket__body { display: flex; flex-direction: column; gap: 3px; }
  .ticket__title { font-weight: 700; font-size: 15px; }
  .ticket__meta { font-size: 13px; color: var(--text-muted); }
  .ticket__dims { font-size: 13.5px; }

  .empty-state[hidden] { display: none; }
  .empty-state { text-align: center; color: var(--text-muted); padding: 18px; font-size: 13.5px; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; }

  @media (max-width: 480px) {
    .ticket { flex-direction: column; align-items: stretch; }
  }
</style>

<div class="app">
  <header class="app-bar">
    <div class="app-bar__title">
      <span class="app-bar__icon">🔩</span>
      <span>הזמנת חיתוך</span>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="office" role="tab" aria-selected="true">משרד · הזנת פריטים</button>
      <button type="button" class="tab" data-tab="worker" role="tab" aria-selected="false">עובד חיתוך · ביצוע</button>
    </div>
  </header>

  <main class="view" data-view="office">
    <div class="global-paste" id="globalPaste" tabindex="0">
      <div class="global-paste__icon">📋</div>
      <div class="global-paste__text">
        <strong>הדבק תמונה (Ctrl+V)</strong> בכל מקום בעמוד - היא תיכנס אוטומטית לפריט הפנוי הבא ותנסה למלא אותו לפי הצילום
      </div>
    </div>

    <div class="items-list" id="itemsList"></div>

    <div class="office-actions">
      <button type="button" class="btn btn--ghost" id="addRowBtn">➕ הוסף פריט</button>
      <button type="button" class="btn btn--accent" id="submitBtn">📤 שלח לעובד החיתוך</button>
    </div>
    <div class="office-status" id="officeStatus" role="status"></div>
  </main>

  <main class="view" data-view="worker" hidden>
    <section class="worker-section">
      <h2 class="worker-section__title">ממתינים לחיתוך <span class="count-pill" id="pendingCount">0</span></h2>
      <div class="ticket-list" id="pendingList"></div>
      <p class="empty-state" id="pendingEmpty" hidden>אין פריטים ממתינים כרגע.</p>
    </section>
    <section class="worker-section">
      <h2 class="worker-section__title">בוצעו לאחרונה</h2>
      <div class="ticket-list ticket-list--done" id="doneList"></div>
      <p class="empty-state" id="doneEmpty" hidden>עוד לא בוצעו פריטים.</p>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script>
  // ============================================================
  // db capability
  // ============================================================
  let db = null;
  const dbReady = (async () => {
    if (typeof window.claude === 'undefined') return null;
    try { return await window.claude.use('db'); } catch (e) { return null; }
  })();
  dbReady.then((resolved) => {
    db = resolved;
    if (!db) {
      officeStatus.textContent = 'שים לב: העמוד נפתח ללא חיבור למסד הנתונים המשותף (למשל כקובץ מקומי). אפשר למלא פריטים, אך לא לשלוח אותם לעובד. פתח את הקישור המפורסם כדי שהשליחה תעבוד.';
      submitBtn.disabled = true;
    }
  });

  // ============================================================
  // Tabs
  // ============================================================
  const tabs = document.querySelectorAll('.tab');
  const views = document.querySelectorAll('.view');
  let workerViewInitialized = false;

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      tabs.forEach((t) => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      const target = tab.dataset.tab;
      views.forEach((v) => { v.hidden = v.dataset.view !== target; });
      if (target === 'worker' && !workerViewInitialized) {
        workerViewInitialized = true;
        initWorkerView();
      }
    });
  });

  // ============================================================
  // OCR: pure helpers (image preprocessing / recognition / parsing)
  // ============================================================
  function loadImageElement(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  async function buildPreprocessedCanvas(file, scale) {
    const img = await loadImageElement(file);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  // Cropping tightly around a single WORD (not a whole table line/row) matters:
  // a table row's bbox also contains the Hebrew label text, and re-recognizing
  // that whole strip with a digit-only whitelist can make the engine "invent"
  // extra digits from label glyphs or swallow the tiny decimal point entirely
  // (e.g. "12.7" coming back as "127"). A word-level bbox avoids that noise.
  async function recognizeNumberInRegion(canvas, bbox) {
    const pad = 8;
    const x = Math.max(0, Math.floor(bbox.x0 - pad));
    const y = Math.max(0, Math.floor(bbox.y0 - pad));
    const w = Math.min(canvas.width - x, Math.ceil((bbox.x1 - bbox.x0) + pad * 2));
    const h = Math.min(canvas.height - y, Math.ceil((bbox.y1 - bbox.y0) + pad * 2));
    if (w <= 0 || h <= 0) return null;

    const upscale = 4;
    const crop = document.createElement('canvas');
    crop.width = w * upscale;
    crop.height = h * upscale;
    const cctx = crop.getContext('2d');
    cctx.imageSmoothingEnabled = true;
    cctx.imageSmoothingQuality = 'high';
    cctx.drawImage(canvas, x, y, w, h, 0, 0, crop.width, crop.height);

    try {
      const { data } = await Tesseract.recognize(crop, 'eng', {
        tessedit_char_whitelist: '0123456789.,'
      });
      const cleaned = data.text.replace(/\s+/g, '');
      const match = cleaned.match(/\d+[.,]?\d*/);
      return match ? match[0].replace(',', '.') : null;
    } catch (e) {
      console.warn('region OCR failed', e);
      return null;
    }
  }

  // Tesseract.js (v5) returns a nested tree - data.blocks[].paragraphs[].lines[].words[] -
  // there is no flat data.lines/data.words array. Walk it down to a flat line list.
  function flattenOcrLines(ocrData) {
    if (Array.isArray(ocrData.lines)) return ocrData.lines;
    const lines = [];
    for (const block of ocrData.blocks || []) {
      for (const para of block.paragraphs || []) {
        for (const line of para.lines || []) {
          lines.push(line);
        }
      }
    }
    return lines;
  }

  // Finds the Hebrew label's own text line, then returns the bbox of the
  // numeric word on that same line (never the whole line/row bbox) so the
  // focused re-scan above only ever sees the digits themselves.
  function findLabelNumberBbox(ocrData, labelRegex) {
    if (!ocrData) return null;
    const lines = flattenOcrLines(ocrData);
    for (const line of lines) {
      if (!labelRegex.test(line.text)) continue;
      const words = (line.words || []).filter((w) => /\d/.test(w.text));
      let best = null;
      for (const w of words) {
        const cleaned = w.text.replace(/[^\d.,]/g, '');
        if (cleaned && (!best || cleaned.length > best.cleaned.length)) {
          best = { bbox: w.bbox, cleaned };
        }
      }
      if (best) return best.bbox;
    }
    return null;
  }

  function findNumberNear(text, label) {
    const lines = text.split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].includes(label)) {
        const candidates = [lines[i], lines[i + 1] || ''];
        for (const line of candidates) {
          const m = line.match(/(\d+(?:[.,]\d+)?)/);
          if (m) return m[1].replace(',', '.');
        }
      }
    }
    return null;
  }

  // Raw-material systems typically state the shape as a code in an
  // "אפיון" / "מפרט טכני" field (e.g. "BAR-RND\מוט עגול" for round bar).
  // Prefer reading that field when present; otherwise fall back to
  // scanning the whole recognized text for the same keywords/codes.
  function detectShapeFromText(text) {
    const lines = text.split('\n');
    const labeledLines = lines.filter((l) => /אפיון|מפרט\s*טכני/.test(l));
    const searchIn = labeledLines.length ? labeledLines.join('\n') : text;

    if (/BAR[-\s]?RND|BAR[-\s]?ROUND|עגול|מוט/.test(searchIn)) return 'מוט';
    if (/\bPLATE\b|\bSHEET\b|BAR[-\s]?SQ|פלטה|לוח|ריבוע|מלבן/.test(searchIn)) return 'פלטה';
    return null;
  }

  function translateStatus(status) {
    const map = {
      'loading tesseract core': 'טוען מנוע זיהוי',
      'initializing tesseract': 'מאתחל',
      'loading language traineddata': 'טוען שפה',
      'initializing api': 'מאתחל ממשק',
      'recognizing text': 'מזהה טקסט'
    };
    return map[status] || status;
  }

  function autoGrowTextarea(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // ============================================================
  // Item rows (office view)
  // ============================================================
  const MAX_ROWS = 10;
  let rowSeq = 0;
  const rows = [];
  const itemsList = document.getElementById('itemsList');
  const addRowBtn = document.getElementById('addRowBtn');
  const submitBtn = document.getElementById('submitBtn');
  const officeStatus = document.getElementById('officeStatus');

  function rowTemplate() {
    return `
      <div class="item-card">
        <div class="item-card__head">
          <span class="item-card__num" data-role="num">פריט</span>
          <button type="button" class="icon-btn danger" data-action="remove" title="הסר פריט" aria-label="הסר פריט">✕</button>
        </div>

        <div class="field-grid">
          <label class="field"><span>צורה</span>
            <select data-field="shape">
              <option value="">בחר צורה</option>
              <option value="מוט">מוט</option>
              <option value="פלטה">פלטה</option>
            </select>
          </label>
          <label class="field"><span>חומר</span>
            <input type="text" data-field="material" placeholder="לדוגמה: AISI 303">
          </label>
          <label class="field"><span>מס' יחידות</span>
            <input type="number" min="1" data-field="units">
          </label>
        </div>

        <div class="dims-group" data-dims="פלטה" hidden>
          <div class="dims-row">
            <label class="field"><span>H (גובה)</span><input type="number" step="any" data-field="h"></label>
            <label class="field"><span>W (רוחב)</span><input type="number" step="any" data-field="w"></label>
            <label class="field"><span>L (אורך)</span><input type="number" step="any" data-field="l_plate"></label>
          </div>
        </div>
        <div class="dims-group" data-dims="מוט" hidden>
          <div class="dims-row">
            <label class="field"><span>קוטר</span><input type="number" step="any" data-field="d"></label>
            <label class="field"><span>L (אורך)</span><input type="number" step="any" data-field="l_rod"></label>
          </div>
        </div>

        <div class="ocr-toggle-row">
          <button type="button" class="btn btn--small" data-action="toggle-ocr">📷 זיהוי מתמונה (OCR)</button>
          <span class="ocr-badge" data-role="badge" hidden>תמונה מצורפת</span>
        </div>

        <div class="ocr-panel" data-role="panel" hidden>
          <div class="ocr-panel__controls">
            <input type="file" accept="image/*" class="file-input" data-role="fileInput">
            <button type="button" class="btn btn--small btn--steel" data-action="runOcr" disabled>🔍 זהה טקסט מהתמונה</button>
          </div>
          <div class="paste-zone" data-role="pasteZone" tabindex="0">אפשר גם להדביק תמונה כאן (Ctrl+V)</div>
          <div class="img-preview-wrap" data-role="imgPreviewWrap" hidden>
            <img data-role="imgPreview" alt="תצוגה מקדימה">
            <button type="button" class="remove-img-btn" data-action="removeImg" aria-label="הסר תמונה">✕</button>
          </div>
          <div class="ocr-status" data-role="status"></div>
          <div class="ocr-warning" data-role="warning" hidden>⚠️ יש לבדוק את השדות המספריים (קוטר / אורך) - זיהוי אוטומטי אינו מובטח ב-100%.</div>
          <div class="ocr-raw-wrap" data-role="rawWrap" hidden>
            <label>טקסט שזוהה (ניתן לתקן ידנית לפני מילוי):</label>
            <textarea data-role="raw"></textarea>
            <button type="button" class="btn btn--small btn--success" data-action="applyOcr">✅ מלא את הפריט לפי הטקסט</button>
          </div>
        </div>
      </div>
    `;
  }

  function addRow() {
    if (rows.length >= MAX_ROWS) return null;
    rowSeq += 1;
    const wrap = document.createElement('div');
    wrap.innerHTML = rowTemplate().trim();
    const el = wrap.firstElementChild;
    itemsList.appendChild(el);

    const row = {
      el,
      fields: {
        shape: el.querySelector('[data-field="shape"]'),
        material: el.querySelector('[data-field="material"]'),
        units: el.querySelector('[data-field="units"]'),
        h: el.querySelector('[data-field="h"]'),
        w: el.querySelector('[data-field="w"]'),
        l_plate: el.querySelector('[data-field="l_plate"]'),
        d: el.querySelector('[data-field="d"]'),
        l_rod: el.querySelector('[data-field="l_rod"]')
      },
      dimsPlate: el.querySelector('[data-dims="פלטה"]'),
      dimsRod: el.querySelector('[data-dims="מוט"]'),
      numEl: el.querySelector('[data-role="num"]'),
      ocr: {
        file: null,
        lastData: null,
        lastCanvas: null,
        panel: el.querySelector('[data-role="panel"]'),
        badge: el.querySelector('[data-role="badge"]'),
        fileInput: el.querySelector('[data-role="fileInput"]'),
        runBtn: el.querySelector('[data-action="runOcr"]'),
        pasteZone: el.querySelector('[data-role="pasteZone"]'),
        imgPreviewWrap: el.querySelector('[data-role="imgPreviewWrap"]'),
        imgPreview: el.querySelector('[data-role="imgPreview"]'),
        status: el.querySelector('[data-role="status"]'),
        warning: el.querySelector('[data-role="warning"]'),
        rawWrap: el.querySelector('[data-role="rawWrap"]'),
        raw: el.querySelector('[data-role="raw"]')
      }
    };
    rows.push(row);

    row.fields.shape.addEventListener('change', () => {
      const v = row.fields.shape.value;
      row.dimsPlate.hidden = v !== 'פלטה';
      row.dimsRod.hidden = v !== 'מוט';
    });

    el.querySelector('[data-action="remove"]').addEventListener('click', () => removeRow(row));
    el.querySelector('[data-action="toggle-ocr"]').addEventListener('click', () => {
      row.ocr.panel.hidden = !row.ocr.panel.hidden;
    });
    el.querySelector('[data-action="removeImg"]').addEventListener('click', () => clearRowImage(row));
    el.querySelector('[data-action="runOcr"]').addEventListener('click', () => runOcrForRow(row));
    el.querySelector('[data-action="applyOcr"]').addEventListener('click', () => {
      applyOcrToRow(row, row.ocr.raw.value, row.ocr.lastData, row.ocr.lastCanvas);
    });
    row.ocr.raw.addEventListener('input', () => autoGrowTextarea(row.ocr.raw));
    row.ocr.fileInput.addEventListener('change', function () {
      const file = this.files && this.files[0] ? this.files[0] : null;
      if (file) loadImageIntoRow(row, file);
    });
    row.ocr.pasteZone.addEventListener('focus', () => row.ocr.pasteZone.classList.add('dragover'));
    row.ocr.pasteZone.addEventListener('blur', () => row.ocr.pasteZone.classList.remove('dragover'));
    row.ocr.pasteZone.addEventListener('dragover', (e) => { e.preventDefault(); row.ocr.pasteZone.classList.add('dragover'); });
    row.ocr.pasteZone.addEventListener('dragleave', () => row.ocr.pasteZone.classList.remove('dragover'));
    row.ocr.pasteZone.addEventListener('drop', (e) => {
      e.preventDefault();
      row.ocr.pasteZone.classList.remove('dragover');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file && file.type.indexOf('image') !== -1) loadImageIntoRow(row, file);
    });

    renumberRows();
    addRowBtn.disabled = rows.length >= MAX_ROWS;
    return row;
  }

  function removeRow(row) {
    row.el.remove();
    const idx = rows.indexOf(row);
    if (idx !== -1) rows.splice(idx, 1);
    if (rows.length === 0) addRow();
    renumberRows();
    addRowBtn.disabled = rows.length >= MAX_ROWS;
  }

  function renumberRows() {
    rows.forEach((r, i) => { r.numEl.textContent = `פריט ${i + 1}`; });
  }

  function resetAllRows() {
    itemsList.innerHTML = '';
    rows.length = 0;
    addRow();
  }

  function loadImageIntoRow(row, file) {
    row.ocr.file = file;
    row.ocr.imgPreview.src = URL.createObjectURL(file);
    row.ocr.imgPreviewWrap.hidden = false;
    row.ocr.runBtn.disabled = false;
    row.ocr.status.textContent = 'תמונה נטענה. לוחצים על "זהה טקסט מהתמונה".';
    row.ocr.warning.hidden = true;
    row.ocr.rawWrap.hidden = true;
    row.ocr.badge.hidden = false;
    row.ocr.panel.hidden = false;
  }

  function clearRowImage(row) {
    row.ocr.file = null;
    row.ocr.lastData = null;
    row.ocr.lastCanvas = null;
    row.ocr.imgPreviewWrap.hidden = true;
    row.ocr.imgPreview.src = '';
    row.ocr.runBtn.disabled = true;
    row.ocr.status.textContent = '';
    row.ocr.warning.hidden = true;
    row.ocr.rawWrap.hidden = true;
    row.ocr.raw.value = '';
    row.ocr.raw.style.height = '';
    row.ocr.fileInput.value = '';
    row.ocr.badge.hidden = true;
  }

  async function runOcrForRow(row) {
    if (!row.ocr.file) return;
    row.ocr.runBtn.disabled = true;
    row.ocr.warning.hidden = true;
    row.ocr.status.textContent = 'מעבד את התמונה...';

    try {
      const canvas = await buildPreprocessedCanvas(row.ocr.file, 2.5);
      row.ocr.status.textContent = 'מזהה טקסט מהתמונה...';

      const { data } = await Tesseract.recognize(canvas, 'heb+eng', {
        logger: (m) => {
          if (m.status && typeof m.progress === 'number') {
            row.ocr.status.textContent = `${translateStatus(m.status)} ${(m.progress * 100).toFixed(0)}%`;
          }
        }
      });

      row.ocr.raw.value = data.text.trim();
      row.ocr.rawWrap.hidden = false;
      autoGrowTextarea(row.ocr.raw);
      row.ocr.lastData = data;
      row.ocr.lastCanvas = canvas;

      row.ocr.status.textContent = 'מדייק ערכים מספריים...';
      await applyOcrToRow(row, data.text, data, canvas);

      row.ocr.status.textContent = 'זיהוי הושלם. בדוק את השדות ותקן במידת הצורך.';
      row.ocr.warning.hidden = false;
    } catch (err) {
      console.error(err);
      row.ocr.status.textContent = 'אירעה שגיאה בזיהוי הטקסט. נסה תמונה ברורה יותר.';
    } finally {
      row.ocr.runBtn.disabled = false;
    }
  }

  async function applyOcrToRow(row, rawText, ocrData, canvas) {
    const text = rawText.replace(/\r/g, '');

    const detectedShape = detectShapeFromText(text);
    if (detectedShape) {
      row.fields.shape.value = detectedShape;
      row.fields.shape.dispatchEvent(new Event('change'));
    }

    const materialMatch = text.match(/AISI\s*[- ]?\s*\d+/i);
    if (materialMatch) {
      row.fields.material.value = materialMatch[0].toUpperCase().replace(/\s+/g, ' ');
    }

    let outerDiameter = null;
    let length = null;
    let hVal = null;
    let wVal = null;

    if (ocrData && canvas) {
      const outerBbox = findLabelNumberBbox(ocrData, /קוטר\s*חיצוני/);
      const innerBbox = findLabelNumberBbox(ocrData, /קוטר\s*פנימי/);
      const lengthBbox = findLabelNumberBbox(ocrData, /אורך|ארוך/);
      const hBbox = findLabelNumberBbox(ocrData, /גובה/);
      const wBbox = findLabelNumberBbox(ocrData, /רוחב/);

      if (outerBbox) outerDiameter = await recognizeNumberInRegion(canvas, outerBbox);
      if (lengthBbox) length = await recognizeNumberInRegion(canvas, lengthBbox);
      if (hBbox) hVal = await recognizeNumberInRegion(canvas, hBbox);
      if (wBbox) wVal = await recognizeNumberInRegion(canvas, wBbox);

      if (!outerDiameter && !innerBbox) {
        const genericBbox = findLabelNumberBbox(ocrData, /קוטר/);
        if (genericBbox) outerDiameter = await recognizeNumberInRegion(canvas, genericBbox);
      }
    }

    if (!outerDiameter) outerDiameter = findNumberNear(text, 'קוטר חיצוני') || findNumberNear(text, 'קוטר');
    if (!length) length = findNumberNear(text, 'אורך') || findNumberNear(text, 'ארוך');
    if (!hVal) hVal = findNumberNear(text, ' H ') || findNumberNear(text, 'גובה');
    if (!wVal) wVal = findNumberNear(text, ' W ') || findNumberNear(text, 'רוחב');

    if (outerDiameter) row.fields.d.value = outerDiameter;
    if (length) {
      row.fields.l_rod.value = length;
      row.fields.l_plate.value = length;
    }
    if (hVal) row.fields.h.value = hVal;
    if (wVal) row.fields.w.value = wVal;

    const unitsMatch = text.match(/(?:מס['׳]?\s*יחיד|כמות)[^\d]{0,10}(\d+)/);
    if (unitsMatch) row.fields.units.value = unitsMatch[1];
  }

  // ============================================================
  // Global paste - routes each pasted/uploaded image to the next row
  // that doesn't have one yet, auto-adding a fresh row if all existing
  // ones already have an image (up to MAX_ROWS), then runs OCR on it.
  // ============================================================
  function routeIncomingImage(file) {
    let target = rows.find((r) => !r.ocr.file);
    if (!target) {
      if (rows.length >= MAX_ROWS) {
        alert(`הגעת למספר המרבי של פריטים (${MAX_ROWS}).`);
        return;
      }
      target = addRow();
    }
    loadImageIntoRow(target, file);
    target.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    runOcrForRow(target);
  }

  function extractImageFromClipboard(clipboardData) {
    if (!clipboardData || !clipboardData.items) return null;
    for (const item of clipboardData.items) {
      if (item.type && item.type.indexOf('image') !== -1) return item.getAsFile();
    }
    return null;
  }

  document.addEventListener('paste', function (e) {
    const officeView = document.querySelector('[data-view="office"]');
    if (officeView.hidden) return;
    const file = extractImageFromClipboard(e.clipboardData || window.clipboardData);
    if (!file) return;
    e.preventDefault();

    const active = document.activeElement;
    const rowForActiveZone = rows.find((r) => r.ocr.pasteZone === active);
    if (rowForActiveZone) {
      loadImageIntoRow(rowForActiveZone, file);
      runOcrForRow(rowForActiveZone);
    } else {
      routeIncomingImage(file);
    }
  });

  const globalPaste = document.getElementById('globalPaste');
  globalPaste.addEventListener('dragover', (e) => { e.preventDefault(); globalPaste.classList.add('dragover'); });
  globalPaste.addEventListener('dragleave', () => globalPaste.classList.remove('dragover'));
  globalPaste.addEventListener('drop', (e) => {
    e.preventDefault();
    globalPaste.classList.remove('dragover');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file && file.type.indexOf('image') !== -1) routeIncomingImage(file);
  });

  addRowBtn.addEventListener('click', () => addRow());

  // ============================================================
  // Submit to the shared cutting-items store
  // ============================================================
  function collectRowData(row) {
    const shape = row.fields.shape.value;
    const material = row.fields.material.value.trim();
    const units = row.fields.units.value;
    if (!shape || !material || !units) return null;

    let dims = {};
    let dimsText = '';
    if (shape === 'פלטה') {
      const h = row.fields.h.value;
      const w = row.fields.w.value;
      const l = row.fields.l_plate.value;
      dims = { h, w, l };
      dimsText = `H: ${h || '-'} | W: ${w || '-'} | L: ${l || '-'} מ"מ`;
    } else if (shape === 'מוט') {
      const d = row.fields.d.value;
      const l = row.fields.l_rod.value;
      dims = { d, l };
      dimsText = `קוטר: ${d || '-'} | אורך: ${l || '-'} מ"מ`;
    }
    return { shape, material, units: Number(units), dims, dimsText };
  }

  submitBtn.addEventListener('click', async () => {
    await dbReady;
    if (!db) {
      officeStatus.textContent = 'אין חיבור למסד נתונים משותף - פתח את הקישור המפורסם של העמוד (לא קובץ מקומי) כדי לשלוח פריטים.';
      return;
    }

    const collected = rows.map(collectRowData).filter(Boolean);
    if (collected.length === 0) {
      alert('לא הוזן אף פריט תקין (חובה למלא לפחות צורה, חומר ומס\' יחידות).');
      return;
    }

    submitBtn.disabled = true;
    officeStatus.textContent = 'שולח...';
    try {
      const col = db.collection('cutting/items');
      for (const item of collected) {
        await col.add({
          ...item,
          status: 'pending',
          createdAt: new Date().toISOString(),
          doneAt: null
        });
      }
      officeStatus.textContent = `נשלחו ${collected.length} פריטים לעובד החיתוך.`;
      resetAllRows();
    } catch (e) {
      officeStatus.textContent = 'שגיאה בשליחה: ' + (e && e.message ? e.message : String(e));
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ============================================================
  // Worker view
  // ============================================================
  const pendingList = document.getElementById('pendingList');
  const pendingEmpty = document.getElementById('pendingEmpty');
  const pendingCount = document.getElementById('pendingCount');
  const doneList = document.getElementById('doneList');
  const doneEmpty = document.getElementById('doneEmpty');

  function renderTickets(container, emptyEl, docs, isDone) {
    container.innerHTML = '';
    emptyEl.hidden = docs.length !== 0;
    docs.forEach((doc) => {
      const item = doc.data();
      if (!item) return;
      const ticket = document.createElement('div');
      ticket.className = 'ticket' + (isDone ? ' ticket--done' : '');
      ticket.innerHTML = `
        <div class="ticket__body">
          <div class="ticket__title">${escapeHtml(item.shape)} · ${escapeHtml(item.material)}</div>
          <div class="ticket__dims mono">${escapeHtml(item.dimsText)}</div>
          <div class="ticket__meta">מס' יחידות: ${escapeHtml(item.units)}</div>
        </div>
      `;
      const btn = document.createElement('button');
      btn.type = 'button';
      if (isDone) {
        btn.className = 'btn btn--small';
        btn.textContent = '↩ החזר לממתין';
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            await db.collection('cutting/items').doc(doc.id).update({ status: 'pending', doneAt: null });
          } catch (e) {
            alert('שגיאה בעדכון: ' + (e && e.message ? e.message : String(e)));
            btn.disabled = false;
          }
        });
      } else {
        btn.className = 'btn btn--success';
        btn.textContent = '✔ סימון כבוצע';
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            await db.collection('cutting/items').doc(doc.id).update({ status: 'done', doneAt: new Date().toISOString() });
          } catch (e) {
            alert('שגיאה בעדכון: ' + (e && e.message ? e.message : String(e)));
            btn.disabled = false;
          }
        });
      }
      ticket.appendChild(btn);
      container.appendChild(ticket);
    });
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function initWorkerView() {
    const resolved = await dbReady;
    if (!resolved) {
      pendingEmpty.hidden = false;
      pendingEmpty.textContent = 'אין חיבור למסד הנתונים המשותף בעמוד הזה. פתח את הקישור המפורסם כדי לראות את הפריטים שנשלחו.';
      doneEmpty.hidden = false;
      doneEmpty.textContent = 'אין חיבור למסד הנתונים המשותף.';
      return;
    }

    db.collection('cutting/items').where('status', '==', 'pending').orderBy('createdAt', 'asc').limit(200)
      .onSnapshot((snap) => {
        pendingCount.textContent = String(snap.size);
        renderTickets(pendingList, pendingEmpty, snap.docs, false);
      }, (err) => {
        pendingEmpty.hidden = false;
        pendingEmpty.textContent = 'שגיאה בטעינת פריטים: ' + err.message;
      });

    db.collection('cutting/items').where('status', '==', 'done').orderBy('doneAt', 'desc').limit(30)
      .onSnapshot((snap) => {
        renderTickets(doneList, doneEmpty, snap.docs, true);
      }, (err) => {
        doneEmpty.hidden = false;
        doneEmpty.textContent = 'שגיאה בטעינת פריטים: ' + err.message;
      });
  }

  // init
  addRow();
</script>
